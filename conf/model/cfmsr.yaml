# @package training
model_name: cfmsr
lr: 1e-3
weight_decay: 1e-4
hidden_dim: 64
num_layers: 2
num_heads: 4
ffn_mult: 4.0
num_seeds: 4
dropout: 0.2
classifier_dropout: 0.3
epochs: 100
patience: 20
monitor_metric: loss
monitor_smoothing_window: 3
score_metric: roc_auc
use_node_embedding: true
edge_batchnorm: true
edge_readout: none
model_out: cfmsr_compare_best.pt
predictions_out: cfmsr_test_predictions.csv
